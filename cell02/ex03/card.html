<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <h1 class="card-title">User Profile Card</h1>

    <div class="card">
        <table class="profile-table">
            <tr>
                <td class="img-cell">
                    <img src="https://i.pinimg.com/736x/24/35/d7/2435d74e4a895a2570ea7c79c011912c.jpg" alt="Profile Picture" class="profile-img">
                </td>
            </tr>
            <tr>
                <td class="user-login">Una 67</td>
            </tr>
            <tr>
                <td>
                    <p class="user-desc">42 Bangkok Student</p>
                </td>
            </tr>
            <tr>
                <td class="social-icons">
                    <a href="https://instagram.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram"></a>
                    <a href="https://facebook.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook"></a>
                    <a href="mailto:student@42.fr"><img src="https://cdn-icons-png.flaticon.com/512/542/542689.png" alt="Email"></a>
                </td>
            </tr>
            <tr>
                <td class="contact-btn-cell">
                    <a href="mailto:student@42.fr" class="contact-btn">Contact</a>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
