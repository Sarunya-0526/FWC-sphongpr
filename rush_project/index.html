<!DOCTYPE html>
<html lang="en">

<head>

    <link

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark fixed-top">

            </a>
        </div>
    </nav>

                <div class="col-md-5">

                    <div class="person-card">

                        <img
                            src="images/person1.jpg"

                        <h2>
                            Phudanate

                    </div>

                </div>


                <!-- Person 2 -->
                <div class="col-md-5">

                    <div class="person-card">

                        <img
                            src="images/person2.png"

                            class="person-image">

                        <h2>
                            Sarunya
                        </h2>

                        <p>
                            Computer Science Student
                        </p>

                        <a
                            href="person2.html"

                        </a>

    <footer>
        <p>
