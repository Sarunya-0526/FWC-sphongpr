<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        
        table {
            width: 100vw;
            height: 100vh;
            border-collapse: collapse; 
        }

        td {
            border: 1px solid black;
            width: 50%;
            text-align: center;
            font-size: 2em; 
        }
        
        .box1 { background-color: #AFEEEE; }
        .box2 { background-color: #b269f1; }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="box1">First</td>
            <td class="box2">Second</td>
        </tr>
    </table>

</body>
</html>
