<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body { background-color: pink; }
        .title { color: white; text-align: center; font-size: 3em; }
        .shop-container { 
            display: flex; 
            justify-content: center; 
            gap: 80px;
            margin-bottom: 40px; 
        }
        .shop-item { text-align: center; }
        
        .shop-item img { 
            width: 400px;       
            height: 150px;       
            object-fit: contain; 
            margin-bottom: 15px; 
            background-color: white;
            border-radius: 10px;    
            padding: 10px;
        }
        
        .footer { text-align: right; font-style: italic; font-family: monospace; }
    </style>
</head>
<body>
    <h1 class="title">Welcome to the Shop! ★</h1>
    
    <div class="shop-container">
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg" alt="Shopee Logo">
            <br><a href="https://shopee.co.th" target="_blank">Visit Shopee</a>
        </div>
        <div class="shop-item">
            <img src="https://inwfile.com/s-fz/maa9ro.jpg" alt="Mercari Logo">
            <br><a href="https://www.mercari.com" target="_blank">Visit Mercari</a>
        </div>
    </div>
    
    <hr>
    
    <div class="footer">
        &copy; sphongpr 2026
    </div>
</body>
</html>
