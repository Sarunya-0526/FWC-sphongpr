<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse; 
        }

        td {
            border: 1px solid black;
            width: 50%;
            height: 100px;
            padding-left: 10px;
        }

        .box1 { background-color: #AFEEEE; }
        .box2 { background-color: #b269f1; } 
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="box1">First</td>
            <td class="box2">Second</td>
        </tr>
    </table>

</body>
</html>
